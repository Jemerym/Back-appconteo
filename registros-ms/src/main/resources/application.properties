spring.application.name=registros-ms
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/registros_db?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.web.error.include-message=always

# Eureka: este microservicio se registra con su nombre (spring.application.name)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

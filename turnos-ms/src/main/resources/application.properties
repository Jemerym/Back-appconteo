spring.application.name=turnos-ms
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/turnos_db?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.web.error.include-message=always

usuarios.service.url=http://localhost:8082
server.forward-headers-strategy=framework
app.avatares.carpeta=uploads/avatares
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

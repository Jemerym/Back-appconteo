spring.application.name=turnos-ms
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/turnos_db?createDatabaseIfNotExist=true&serverTimezone=America/Santiago
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.web.error.include-message=always

# Antes: http://localhost:8082. Ahora por nombre: Eureka dice dónde está usuarios-ms
usuarios.service.url=http://usuarios-ms
server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Eureka: este microservicio se registra con su nombre (spring.application.name)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

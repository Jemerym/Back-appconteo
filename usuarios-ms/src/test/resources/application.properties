# Configuración SOLO para los tests: base de datos H2 en memoria y sin Eureka
spring.application.name=usuarios-ms
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
roles.service.url=http://localhost:8081
usuarios.service.url=http://localhost:8082
app.avatares.carpeta=target/test-avatares

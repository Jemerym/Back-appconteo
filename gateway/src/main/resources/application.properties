spring.application.name=gateway
server.port=8080

# Se registra en Eureka y lo usa para encontrar los microservicios por su nombre
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Rutas: lo que llega a /api/xxx/** se reenvía al microservicio xxx-ms.
# "lb://" = buscar el microservicio en Eureka (lb = load balancer).
spring.cloud.gateway.server.webflux.routes[0].id=roles-ms
spring.cloud.gateway.server.webflux.routes[0].uri=lb://roles-ms
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/roles/**

spring.cloud.gateway.server.webflux.routes[1].id=usuarios-ms
spring.cloud.gateway.server.webflux.routes[1].uri=lb://usuarios-ms
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/usuarios/**

spring.cloud.gateway.server.webflux.routes[2].id=turnos-ms
spring.cloud.gateway.server.webflux.routes[2].uri=lb://turnos-ms
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/turnos/**

spring.cloud.gateway.server.webflux.routes[3].id=registros-ms
spring.cloud.gateway.server.webflux.routes[3].uri=lb://registros-ms
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/registros/**

# La foto de perfil se sube por aquí: se permite el mismo tamaño que en usuarios-ms
spring.codec.max-in-memory-size=5MB

# Reenvía al microservicio de dónde vino la petición (X-Forwarded-Host/Port).
# Así usuarios-ms arma la URL de la foto de perfil con el puerto del gateway (8080) y no con el suyo (8082).
spring.cloud.gateway.server.webflux.trusted-proxies=.*
